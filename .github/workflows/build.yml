name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/sss-3333/golden-thread:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE" .

      - name: Scan
        uses: aquasecurity/trivy-action@<same version as your trackance-aks workflow>
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"